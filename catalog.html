<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de ejercicios | Consulta</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717} a{text-decoration:none;color:inherit}
    header{background:#111;color:#fff;padding:24px 16px;border-bottom:5px solid #f8d34a}
    .nav{width:min(1200px,94%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .nav h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);color:#f8d34a}.nav .links{display:flex;gap:10px;flex-wrap:wrap}
    .nav .links a{background:#fff;color:#111;padding:10px 14px;border-radius:8px;font-weight:bold;border:1px solid #ddd}
    .controls{width:min(1200px,94%);margin:22px auto 8px;display:grid;grid-template-columns:1fr 200px 180px;gap:12px}
    input,select{padding:14px 12px;border:1px solid #bdbdbd;border-radius:8px;background:#fff;font-size:16px}
    #contador{width:min(1200px,94%);margin:0 auto 12px;color:#222;font-weight:bold}
    #estado{width:min(1200px,94%);margin:18px auto;text-align:center;color:#555;font-weight:600}
    #resultados{width:min(1200px,94%);margin:auto;padding-bottom:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .card{background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden}
    .card img{width:100%;height:220px;object-fit:contain;background:#efefef;display:block}
    .content{padding:16px}
    .content h2{margin:0 0 8px;font-size:20px}
    .badge{display:inline-block;background:#f8d34a;color:#111;font-weight:bold;border-radius:999px;padding:5px 10px;font-size:12px;margin-bottom:8px}
    .dato{font-size:14px;line-height:1.5;margin:5px 0;color:#333}
    .dato strong{color:#1d5d47}
    .id{color:#666;font-size:12px;word-break:break-all}
    .botones{display:flex;gap:8px;margin-top:14px}
    .botones a{flex:1;padding:10px;text-align:center;border-radius:8px;font-weight:bold;font-size:13px}
    .ver{background:#111;color:#fff}.descargar{background:#f8d34a;color:#111}
    @media(max-width:760px){.controls{grid-template-columns:1fr}.nav{justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <h1>Catálogo de ejercicios</h1>
      <div class="links">
        <a href="./index.html">Legends Gym</a>
      </div>
    </div>
  </header>

  <section class="controls">
    <input id="buscador" type="search" placeholder="Busca por nombre, ID, categoría o músculo..." />
    <select id="categoria">
      <option value="">Todas</option>
      <option>Abdomen</option>
      <option>Piernas</option>
      <option>Espalda</option>
      <option>Pecho</option>
      <option>Brazos</option>
      <option>Hombros</option>
      <option>Glúteos</option>
      <option>Estiramientos</option>
    </select>
    <select id="cantidad">
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="200">200</option>
      <option value="500">500</option>
    </select>
  </section>

  <div id="contador"></div>
  <div id="estado">Cargando catálogo...</div>
  <main id="resultados"></main>

  <script>
    const EXERCISES_URL = "https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/exercises.json";
    const GIF_URL = "https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/";
    let ejercicios = [];
    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function lista(value) {
      if (Array.isArray(value) && value.length) return value.join(", ");
      if (typeof value === "string" && value.trim()) return value;
      return "No especificado";
    }

    function mostrar() {
      const q = $("buscador").value.trim().toLowerCase();
      const cat = $("categoria").value;
      const limite = Number($("cantidad").value);

      const filtrados = ejercicios.filter((e) => {
        const haystack = [
          e.name,
          e.exerciseName,
          e.originalName,
          e.id,
          e.category,
          e.bodyPart,
          e.equipment,
          e.targetMuscles,
          e.secondaryMuscles,
          e.muscles,
          e.gif
        ].flat().filter(Boolean).join(" ").toLowerCase();

        const coincideBusqueda = !q || haystack.includes(q);
        const coincideCategoria = !cat || (e.category || e.bodyPart || "") === cat;
        return coincideBusqueda && coincideCategoria;
      });

      const visibles = filtrados.slice(0, limite);
      $("contador").textContent = `Encontrados: ${filtrados.length} | Mostrando: ${visibles.length}`;
      $("estado").textContent = visibles.length ? "" : "No se encontraron ejercicios.";

      $("resultados").innerHTML = visibles.map((e) => {
        const gif = e.gif || e.file || e.id + ".gif";
        const nombre = e.name || e.exerciseName || "Ejercicio";
        const categoria = e.category || e.bodyPart || "General";
        const url = `${GIF_URL}${encodeURIComponent(gif)}`;

        return `
          <article class="card">
            <img src="${url}" alt="${esc(nombre)}" loading="lazy" />
            <div class="content">
              <span class="badge">${esc(categoria)}</span>
              <h2>${esc(nombre)}</h2>
              <div class="dato"><strong>ID:</strong> <span class="id">${esc(e.id || "Sin ID")}</span></div>
              <div class="dato"><strong>Equipamiento:</strong> ${esc(lista(e.equipment || e.equipmentType))}</div>
              <div class="dato"><strong>Músculos:</strong> ${esc(lista(e.targetMuscles || e.muscles))}</div>
              <div class="dato"><strong>Secundarios:</strong> ${esc(lista(e.secondaryMuscles))}</div>
              <div class="dato"><strong>Parte del cuerpo:</strong> ${esc(lista(e.bodyPart))}</div>
              <div class="botones">
                <a class="ver" href="${url}" target="_blank" rel="noopener">Ver GIF</a>
                <a class="descargar" href="${url}" download="${esc(gif)}" target="_blank" rel="noopener">Descargar</a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function cargar() {
      try {
        const respuesta = await fetch(EXERCISES_URL);
        if (!respuesta.ok) throw new Error("No se pudo cargar el catálogo");
        const json = await respuesta.json();
        ejercicios = Array.isArray(json) ? json : (json.exercises || json.data || []);
        mostrar();
      } catch (error) {
        console.error(error);
        $("estado").textContent = "No se pudo cargar el catálogo, intenta más tarde.";
      }
    }

    ["buscador", "categoria", "cantidad"].forEach((id) => {
      $(id).addEventListener(id === "buscador" ? "input" : "change", mostrar);
    });

    cargar();
  </script>
</body>
</html>

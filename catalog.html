<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo completo de ejercicios | Consulta</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}header{background:#111;color:#fff;padding:24px 16px;border-bottom:5px solid #f8d34a}.nav{width:min(1200px,94%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nav h1{margin:0;color:#f8d34a;font-size:clamp(1.8rem,4vw,2.6rem)}.links a{background:#fff;color:#111;padding:10px 14px;border-radius:8px;font-weight:bold}.controls{width:min(1200px,94%);margin:22px auto 8px;display:grid;grid-template-columns:1fr 200px 180px;gap:12px}input,select{padding:14px 12px;border:1px solid #bdbdbd;border-radius:8px;background:#fff;font-size:16px}#contador,#paginacion{width:min(1200px,94%);margin:0 auto 12px;font-weight:bold}#estado{width:min(1200px,94%);margin:18px auto;text-align:center;color:#555;font-weight:600}#resultados{width:min(1200px,94%);margin:auto;padding-bottom:25px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:12px;box-shadow:0 4px 12px #0002;overflow:hidden}.card img{width:100%;height:220px;object-fit:contain;background:#efefef;display:block}.content{padding:16px}.content h2{margin:0 0 8px;font-size:20px}.badge{display:inline-block;background:#f8d34a;color:#111;font-weight:bold;border-radius:999px;padding:5px 10px;font-size:12px;margin-bottom:8px}.dato{font-size:14px;line-height:1.5;margin:5px 0;color:#333}.dato strong{color:#1d5d47}.id{color:#666;font-size:12px;word-break:break-all}.botones{display:flex;gap:8px;margin-top:14px}.botones a{flex:1;padding:10px;text-align:center;border-radius:8px;font-weight:bold;font-size:13px}.ver{background:#111;color:#fff}.descargar{background:#f8d34a;color:#111}.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px auto 35px}.pages button{border:0;border-radius:8px;padding:11px 18px;background:#111;color:#fff;font-weight:bold;cursor:pointer}.pages button:disabled{background:#aaa;cursor:not-allowed}.pages span{font-weight:bold}@media(max-width:760px){.controls{grid-template-columns:1fr}.nav{justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <header><div class="nav"><h1>Catálogo de ejercicios</h1><div class="links"><a href="./index.html">LEGENDS GYM</a></div></div></header>
  <section class="controls"><input id="buscador" type="search" placeholder="Busca por nombre, ID, músculo o equipo..." /><select id="categoria"><option value="">Todas las categorías</option><option value="waist">Abdomen</option><option value="legs">Piernas</option><option value="chest">Pecho</option><option value="back">Espalda</option><option value="shoulders">Hombros</option><option value="upper arms">Brazos</option><option value="cardio">Cardio</option></select><select id="porPagina"><option value="24">24 por página</option><option value="48" selected>48 por página</option><option value="96">96 por página</option></select></section>
  <div id="contador"></div><div id="estado">Cargando catálogo completo...</div><main id="resultados"></main><div class="pages"><button id="anterior">Anterior</button><span id="pagina"></span><button id="siguiente">Siguiente</button></div>
  <script>
    const EXERCISES_URL="https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/exercises.json";
    const GIF_URL="https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/";
    let ejercicios=[], paginaActual=1;
    const $=id=>document.getElementById(id);
    function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
    function lista(v){return Array.isArray(v)&&v.length?v.join(", "):typeof v==="string"&&v.trim()?v:"No especificado"}
    function categoria(e){return Array.isArray(e.bodyParts)&&e.bodyParts.length?e.bodyParts[0]:"general"}
    function nombreCategoria(v){return ({waist:"Abdomen",legs:"Piernas",chest:"Pecho",back:"Espalda",shoulders:"Hombros","upper arms":"Brazos",cardio:"Cardio"}[v]||v||"General")}
    function filtrar(){const q=$("buscador").value.trim().toLowerCase(),cat=$("categoria").value;return ejercicios.filter(e=>{const texto=[e.name,e.id,e.gif,e.targetMuscles,e.secondaryMuscles,e.bodyParts,e.equipment,e.instructions].flat().filter(Boolean).join(" ").toLowerCase();return(!q||texto.includes(q))&&(!cat||categoria(e)===cat)})}
    function mostrar(){const listaFiltrada=filtrar(),porPagina=Number($("porPagina").value),totalPaginas=Math.max(1,Math.ceil(listaFiltrada.length/porPagina));if(paginaActual>totalPaginas)paginaActual=totalPaginas;const inicio=(paginaActual-1)*porPagina,visibles=listaFiltrada.slice(inicio,inicio+porPagina);$("contador").textContent=`Catálogo completo: ${ejercicios.length} ejercicios | Encontrados: ${listaFiltrada.length} | Mostrando: ${visibles.length}`;$("pagina").textContent=`Página ${paginaActual} de ${totalPaginas}`;$("anterior").disabled=paginaActual<=1;$("siguiente").disabled=paginaActual>=totalPaginas;$("estado").textContent=visibles.length?"":"No se encontraron ejercicios.";$("resultados").innerHTML=visibles.map(e=>{const gif=e.gif||`${e.id}.gif`,url=GIF_URL+encodeURIComponent(gif),name=e.name||"Ejercicio",cat=categoria(e);return `<article class="card"><img src="${url}" alt="${esc(name)}" loading="lazy"><div class="content"><span class="badge">${esc(nombreCategoria(cat))}</span><h2>${esc(name)}</h2><div class="dato"><strong>ID:</strong> <span class="id">${esc(e.id)}</span></div><div class="dato"><strong>Equipo:</strong> ${esc(lista(e.equipment))}</div><div class="dato"><strong>Músculos principales:</strong> ${esc(lista(e.targetMuscles))}</div><div class="dato"><strong>Músculos secundarios:</strong> ${esc(lista(e.secondaryMuscles))}</div><div class="dato"><strong>GIF:</strong> <span class="id">${esc(gif)}</span></div><div class="botones"><a class="ver" href="${url}" target="_blank" rel="noopener">Ver GIF</a><a class="descargar" href="${url}" download="${esc(gif)}" target="_blank" rel="noopener">Descargar</a></div></div></article>`}).join("")}
    function reiniciar(){paginaActual=1;mostrar()}
    async function cargar(){try{const r=await fetch(EXERCISES_URL);if(!r.ok)throw Error("No se pudo cargar");const data=await r.json();ejercicios=Array.isArray(data)?data:(data.exercises||data.data||[]);mostrar()}catch(e){console.error(e);$("estado").textContent="No se pudo cargar el catálogo completo. Recarga la página o intenta más tarde."}}
    $("buscador").addEventListener("input",reiniciar);$("categoria").addEventListener("change",reiniciar);$("porPagina").addEventListener("change",reiniciar);$("anterior").addEventListener("click",()=>{paginaActual--;mostrar();scrollTo(0,0)});$("siguiente").addEventListener("click",()=>{paginaActual++;mostrar();scrollTo(0,0)});cargar();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de ejercicios | Consulta</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}header{background:#111;color:#fff;padding:24px 16px;border-bottom:5px solid #f8d34a}.nav{width:min(1200px,94%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nav h1{margin:0;color:#f8d34a;font-size:clamp(1.8rem,4vw,2.6rem)}.links a,.action{border:0;background:#fff;color:#111;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px}.controls{width:min(1200px,94%);margin:22px auto 8px;display:grid;grid-template-columns:1fr 200px 180px;gap:12px}input,select{padding:14px 12px;border:1px solid #bdbdbd;border-radius:8px;background:#fff;font-size:16px}.actions{width:min(1200px,94%);margin:12px auto;display:flex;gap:10px;flex-wrap:wrap}.actions .action{background:#111;color:#fff}.actions .action.gold{background:#f8d34a;color:#111}#contador,#estado{width:min(1200px,94%);margin:10px auto;font-weight:bold}#estado{text-align:center;color:#555}.grid{width:min(1200px,94%);margin:auto;padding-bottom:25px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:12px;box-shadow:0 4px 12px #0002;overflow:hidden}.card img{width:100%;height:220px;object-fit:contain;background:#eee;display:block}.content{padding:16px}.content h2{margin:0 0 8px;font-size:20px}.badge{display:inline-block;background:#f8d34a;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold;margin-bottom:8px}.dato{font-size:14px;line-height:1.5;margin:5px 0}.dato strong{color:#17654f}.id{color:#666;font-size:12px;word-break:break-all}.copybox{background:#f0f0f0;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:12px;white-space:pre-wrap;font-family:monospace;font-size:13px;line-height:1.55}.copy{margin-top:8px;width:100%;border:0;border-radius:7px;padding:10px;background:#17654f;color:#fff;font-weight:bold;cursor:pointer}.botones{display:flex;gap:8px;margin-top:12px}.botones a{flex:1;padding:10px;text-align:center;border-radius:8px;font-weight:bold;font-size:13px;text-decoration:none}.ver{background:#111;color:#fff}.descargar{background:#f8d34a;color:#111}.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px auto 35px}.pages button{border:0;border-radius:8px;padding:11px 18px;background:#111;color:#fff;font-weight:bold;cursor:pointer}.pages button:disabled{background:#aaa;cursor:not-allowed}.hidden{display:none!important}.all-grid .card img{height:260px}.all-grid .content{padding:10px}.all-grid .copybox{margin-top:8px}@media(max-width:760px){.controls{grid-template-columns:1fr}.nav{justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <header><div class="nav"><h1>Catálogo de ejercicios</h1><div class="links"><a href="./index.html">LEGENDS GYM</a></div></div></header>
  <section class="controls"><input id="buscador" type="search" placeholder="Busca por nombre, ID, músculo o equipo..." /><select id="categoria"><option value="">Todas las categorías</option><option value="waist">Abdomen</option><option value="legs">Piernas</option><option value="chest">Pecho</option><option value="back">Espalda</option><option value="shoulders">Hombros</option><option value="upper arms">Brazos</option><option value="cardio">Cardio</option></select><select id="porPagina"><option value="24">24 por página</option><option value="48" selected>48 por página</option><option value="96">96 por página</option></select></section>
  <div class="actions"><button class="action gold" id="verTodos">Ver todos los GIFs</button><button class="action hidden" id="volver">Volver al catálogo</button></div>
  <div id="contador"></div><div id="estado">Cargando catálogo completo...</div><main id="resultados" class="grid"></main><div id="paginas" class="pages"><button id="anterior">Anterior</button><span id="pagina"></span><button id="siguiente">Siguiente</button></div>
  <script>
    const EXERCISES_URL="https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/exercises.json";
    const GIF_URL="https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/";
    let ejercicios=[],paginaActual=1,modoTodos=false;
    const $=id=>document.getElementById(id);
    function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
    function lista(v){return Array.isArray(v)&&v.length?v.join(", "):typeof v==="string"&&v.trim()?v:"No especificado"}
    function categoria(e){return Array.isArray(e.bodyParts)&&e.bodyParts.length?e.bodyParts[0]:"general"}
    function nombreCategoria(v){return ({waist:"Abdomen",legs:"Piernas",chest:"Pecho",shoulders:"Hombros",back:"Espalda","upper arms":"Brazos",cardio:"Cardio"}[v]||v||"General")}
    function resultados(){const q=$("buscador").value.trim().toLowerCase(),cat=$("categoria").value;return ejercicios.filter(e=>{const texto=[e.name,e.id,e.gif,e.targetMuscles,e.secondaryMuscles,e.bodyParts,e.equipment,e.instructions].flat().filter(Boolean).join(" ").toLowerCase();return(!q||texto.includes(q))&&(!cat||categoria(e)===cat)})}
    function textoCopiar(e){return `${e.name||""}\nID: ${e.id||""}\nGIF: ${e.gif||e.id+".gif"}`}
    function tarjeta(e,compact=false){const gif=e.gif||`${e.id}.gif`,url=GIF_URL+encodeURIComponent(gif),name=e.name||"Ejercicio",cat=categoria(e);return `<article class="card"><img src="${url}" alt="${esc(name)}" loading="lazy"><div class="content"><span class="badge">${esc(nombreCategoria(cat))}</span><h2>${esc(name)}</h2><div class="dato"><strong>ID:</strong> <span class="id">${esc(e.id)}</span></div><div class="dato"><strong>GIF:</strong> <span class="id">${esc(gif)}</span></div>${compact?"":`<div class="dato"><strong>Equipo:</strong> ${esc(lista(e.equipment))}</div><div class="dato"><strong>Músculos:</strong> ${esc(lista(e.targetMuscles))}</div>`}<div class="copybox">${esc(textoCopiar(e))}</div><button class="copy" data-copy="${esc(textoCopiar(e))}">Copiar nombre, ID y GIF</button><div class="botones"><a class="ver" href="${url}" target="_blank" rel="noopener">Ver GIF</a><a class="descargar" href="${url}" download="${esc(gif)}" target="_blank" rel="noopener">Descargar</a></div></div></article>`}
    function mostrar(){const lista=resultados();$("contador").textContent=`Catálogo completo: ${ejercicios.length} ejercicios | Encontrados: ${lista.length}`;if(modoTodos){$("estado").textContent=`Mostrando todos los GIFs encontrados (${lista.length})`;$("resultados").className="grid all-grid";$("resultados").innerHTML=lista.map(e=>tarjeta(e,true)).join("");$("paginas").classList.add("hidden");return}const n=Number($("porPagina").value),total=Math.max(1,Math.ceil(lista.length/n));if(paginaActual>total)paginaActual=total;const visibles=lista.slice((paginaActual-1)*n,paginaActual*n);$("estado").textContent=visibles.length?"":"No se encontraron ejercicios.";$("resultados").className="grid";$("resultados").innerHTML=visibles.map(e=>tarjeta(e)).join("");$("pagina").textContent=`Página ${paginaActual} de ${total}`;$("anterior").disabled=paginaActual<=1;$("siguiente").disabled=paginaActual>=total;$("paginas").classList.remove("hidden")}
    function copiar(texto,boton){navigator.clipboard.writeText(texto).then(()=>{const original=boton.textContent;boton.textContent="¡Copiado!";setTimeout(()=>boton.textContent=original,1400)}).catch(()=>alert(texto))}
    function reiniciar(){paginaActual=1;mostrar()}
    async function cargar(){try{const r=await fetch(EXERCISES_URL);if(!r.ok)throw Error("No se pudo cargar");const data=await r.json();ejercicios=Array.isArray(data)?data:(data.exercises||data.data||[]);mostrar()}catch(e){console.error(e);$("estado").textContent="No se pudo cargar el catálogo completo."}}
    document.addEventListener("click",e=>{if(e.target.matches("[data-copy]"))copiar(e.target.dataset.copy,e.target)});
    $("buscador").addEventListener("input",reiniciar);$("categoria").addEventListener("change",reiniciar);$("porPagina").addEventListener("change",reiniciar);$("anterior").addEventListener("click",()=>{paginaActual--;mostrar();scrollTo(0,0)});$("siguiente").addEventListener("click",()=>{paginaActual++;mostrar();scrollTo(0,0)});$("verTodos").addEventListener("click",()=>{modoTodos=true;$("verTodos").classList.add("hidden");$("volver").classList.remove("hidden");mostrar()});$("volver").addEventListener("click",()=>{modoTodos=false;$("volver").classList.add("hidden");$("verTodos").classList.remove("hidden");mostrar()});cargar();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache">
<title>LEGENDS GYM | Biblioteca de ejercicios</title>
<style>
:root{--bg:#0d0d0d;--card:#202020;--yellow:#f5c400;--text:#f8f8f8;--muted:#bbb;--line:#3b3b3b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}header{padding:22px 16px 25px;text-align:center;background:linear-gradient(135deg,#090909,#202020);border-bottom:4px solid var(--yellow)}.logo-wrap{display:flex;justify-content:center;margin-bottom:8px}.logo-header{display:block;width:min(460px,82vw);max-height:260px;object-fit:contain;filter:drop-shadow(0 6px 12px #0006)}.brand{margin:5px 0;color:var(--yellow);font-size:clamp(2rem,6vw,3.5rem)}.subtitle{font-weight:800;margin:0}.description,.official{color:var(--muted)}.official{color:var(--yellow);font-weight:bold;font-size:13px}.tools,.summary,.grid{width:min(1180px,94%);margin-left:auto;margin-right:auto}.tools{margin-top:22px}.search{width:100%;padding:15px;border-radius:9px;border:1px solid var(--line);font-size:16px}.quick{display:flex;gap:8px;overflow-x:auto;padding:13px 0 8px}.quick button{white-space:nowrap;background:#252525;color:#fff;border:1px solid #555;border-radius:999px;padding:10px 14px;font-weight:bold;cursor:pointer}.quick button.active,.more,.tech{background:var(--yellow);color:#111}.advanced{display:flex;gap:10px}.advanced select{flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;background:#222;color:#fff}.summary{margin-top:13px;color:var(--muted);font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);border-color:var(--yellow)}.card img{display:block;width:100%;height:175px;object-fit:contain;background:#111}.body{padding:13px}.card h2{margin:5px 0 10px;font-size:17px}.primary{color:var(--yellow);font-size:13px;font-weight:bold}.equipment{color:#ddd;font-size:13px;margin-top:7px}.tech{width:100%;margin-top:12px;border:0;border-radius:8px;padding:10px;font-weight:bold;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:30px}.more-wrap{text-align:center;padding:10px 0 42px}.more{border:0;border-radius:8px;padding:13px 24px;font-weight:bold;cursor:pointer}.top{display:none;position:fixed;right:18px;bottom:18px;border:0;border-radius:50%;width:44px;height:44px;background:var(--yellow);font-size:22px;font-weight:bold;z-index:4}.top.show{display:block}.modal{display:none;position:fixed;inset:0;padding:18px;background:#000c;z-index:10;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{position:relative;width:min(920px,100%);max-height:94vh;overflow:auto;background:#191919;border-top:5px solid var(--yellow);border-radius:12px}.close{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:var(--yellow);font-size:24px;font-weight:bold;cursor:pointer}.modal-content{padding:24px}.modal-content>img{width:100%;max-height:390px;object-fit:contain;background:#090909;border-radius:8px}.modal h2{font-size:clamp(1.4rem,4vw,2.1rem)}.modal h3{color:var(--yellow);font-size:16px;margin:18px 0 5px}.modal p{line-height:1.55}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{padding:10px;background:#252525;border-radius:7px}.fact b{display:block;color:var(--yellow);font-size:12px;margin-bottom:5px}@media(max-width:600px){.logo-header{max-height:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:135px}.body{padding:10px}.card h2{font-size:14px}.tech{font-size:12px;padding:9px}.modal{padding:0}.modal-box{height:100%;max-height:100%;border-radius:0}.modal-content{padding:18px 14px 30px}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="inicio"><div class="logo-wrap"><img src="./assets/logo-legends.png" alt="Logo Legends Gym" class="logo-header"></div><h1 class="brand">LEGENDS GYM</h1><p class="subtitle">BIBLIOTECA DE EJERCICIOS</p><p class="description">Biblioteca de consulta y capacitación de Legends Gym</p><p class="official">Ejercicios seleccionados y revisados por Legends Gym</p></header>
<section class="tools"><input id="buscador" class="search" placeholder="Buscar ejercicio, músculo o equipo..." type="search"><div id="musculos" class="quick"></div><div class="advanced"><select id="equipo"><option value="">Todos los equipos</option><option>Máquina</option><option>Polea</option><option>Mancuernas</option><option>Barra</option><option>Smith</option><option>Banco</option><option>Peso corporal</option><option>Bandas</option><option>Otros</option></select></div></section>
<div id="contador" class="summary"></div><main id="resultados" class="grid"></main><div id="estado" class="empty">Cargando ejercicios...</div><div class="more-wrap"><button id="cargarMas" class="more">CARGAR MÁS EJERCICIOS</button></div><button id="arriba" class="top" aria-label="Volver arriba">↑</button>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="modal-box"><button id="cerrar" class="close" aria-label="Cerrar">×</button><div id="modalContenido" class="modal-content"></div></div></div>
<script>
const GIF_URL='https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/',PAGE=24,$=id=>document.getElementById(id);let all=[],active='',shown=PAGE;
const groups=[['','Todos'],['pecho','Pecho'],['espalda','Espalda'],['hombros','Hombros'],['biceps','Bíceps'],['triceps','Tríceps'],['gluteos','Glúteos'],['cuadriceps','Cuádriceps'],['femoral','Femoral'],['pantorrilla','Pantorrilla'],['abdomen','Abdomen']];
function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function a(v){return Array.isArray(v)?v:(v?[v]:[])}function list(v){return a(v).join(', ')||'No especificado'}function allText(e){return norm([e.name,e.originalName,e.category,e.equipment,e.targetMuscles,e.secondaryMuscles].flat().filter(Boolean).join(' '))}
function muscle(e){if(!active)return true;let s=norm([e.category,e.targetMuscles,e.secondaryMuscles].flat().join(' ')),t={pecho:['pecho','chest','pector'],espalda:['espalda','back','dorsal','lats'],hombros:['hombro','shoulder','deltoid','trapec'],biceps:['biceps'],triceps:['triceps'],gluteos:['glute'],cuadriceps:['cuadriceps','quad'],femoral:['femoral','hamstring'],pantorrilla:['pantorr','calf'],abdomen:['abdomen','abs','waist','core']};return(t[active]||[active]).some(x=>s.includes(x))}
function equip(e,v){if(!v)return true;let s=norm(list(e.equipment));if(norm(v)==='otros')return !['maquina','polea','mancuerna','barra','smith','banco','peso corporal','bandas'].some(x=>s.includes(x));if(norm(v)==='mancuernas')return s.includes('mancuerna');return s.includes(norm(v))}
function purpose(e){let c=norm(e.category),m={piernas:'Fortalece las piernas y mejora la estabilidad.',abdomen:'Fortalece el abdomen y estabiliza el torso.',espalda:'Fortalece la espalda y mejora la postura.',pecho:'Desarrolla el pecho y la fuerza de empuje.',biceps:'Fortalece los bíceps y la flexión del brazo.',triceps:'Fortalece los tríceps y la extensión del brazo.',hombros:'Fortalece los hombros y mejora su estabilidad.',antebrazos:'Fortalece los antebrazos y el agarre.',cardio:'Mejora la resistencia cardiovascular.',estiramientos:'Mejora la flexibilidad y movilidad.'};return m[c]||'Trabaja principalmente '+list(e.targetMuscles)+' y mejora el control y la fuerza.'}
function guide(e){let s=norm([e.targetMuscles].flat().join(' ')),c=norm(e.category),q=norm(list(e.equipment)),type=s.includes('pecho')||s.includes('pector')?'pecho':s.includes('espalda')||s.includes('dorsal')||s.includes('lats')?'espalda':s.includes('hombro')||s.includes('deltoid')||s.includes('trapec')?'hombros':s.includes('biceps')?'biceps':s.includes('triceps')?'triceps':s.includes('cuadriceps')||s.includes('quad')?'cuadriceps':s.includes('femoral')||s.includes('hamstring')?'femoral':s.includes('glute')?'gluteos':s.includes('pantorr')||s.includes('calf')?'pantorrilla':s.includes('aductor')?'aductores':s.includes('antebra')?'antebrazos':c==='cardio'?'cardio':c==='estiramientos'?'estiramientos':s.includes('abdomen')||s.includes('abs')||s.includes('recto abdominal')||s.includes('oblicuo')?'abdomen':'general';let g={pecho:['Colócate estable, retrae suavemente los hombros y prepara el equipo.','Empuja o junta los brazos de forma controlada, sin rebotes.'],espalda:['Mantén el pecho abierto, espalda neutra y hombros abajo.','Lleva los codos hacia atrás sin balancear el torso.'],hombros:['Colócate erguido con el abdomen activo y hombros relajados.','Eleva o presiona con control, sin encoger los hombros.'],biceps:['Mantén el torso estable y los codos cerca del cuerpo.','Flexiona los codos hasta contraer el bíceps y baja lentamente.'],triceps:['Estabiliza los hombros y mantén los codos cerca del cuerpo.','Extiende los codos con control y regresa lentamente.'],cuadriceps:['Apoya los pies y mantén las rodillas alineadas.','Flexiona las piernas y vuelve empujando el suelo con control.'],femoral:['Mantén la cadera estable y la espalda neutra.','Flexiona la rodilla o lleva la cadera atrás con control.'],gluteos:['Apoya los pies firmemente y mantén la pelvis estable.','Extiende la cadera apretando los glúteos sin arquear la espalda.'],pantorrilla:['Colócate estable con el peso repartido en el pie.','Eleva los talones lentamente, pausa y desciende por completo.'],aductores:['Mantén la pelvis estable y las piernas alineadas.','Acerca o separa la pierna con control, sin rebotes.'],antebrazos:['Mantén la muñeca alineada y el agarre controlado.','Mueve la muñeca o el antebrazo lentamente, sin balancear.'],abdomen:['Mantén la espalda y pelvis estables, activando el abdomen.','Acerca el torso o las piernas con control sin tirar del cuello.'],cardio:['Adopta una postura atlética y segura.','Mantén un ritmo constante y ajusta la intensidad a tu nivel.'],estiramientos:['Adopta una postura cómoda y alineada, sin forzar.','Avanza hasta sentir tensión ligera y mantén sin rebotes.'],general:['Adopta una posición estable y activa los músculos principales.','Realiza el movimiento lentamente y vuelve con control.']}[type]||[];if(q.includes('maquina'))g[0]+=' Ajusta la máquina a tu altura.';if(q.includes('polea'))g[0]+=' Selecciona una carga que puedas controlar.';return{start:g[0],move:g[1],breath:'Inhala al preparar el movimiento y exhala durante el esfuerzo.',errors:'Evita impulsos, rebotes, encorvar la espalda o perder el control.',coach:'Prioriza la técnica y aumenta la carga solo cuando puedas mantener una ejecución limpia.'}}
function card(e){return `<article class="card" data-open="${esc(e.id)}"><img src="${GIF_URL+encodeURIComponent(e.gif)}" loading="lazy" alt="${esc(e.name)}"><div class="body"><h2>${esc(e.name)}</h2><div class="primary">Músculo principal: ${esc(list(e.targetMuscles))}</div><div class="equipment">Equipo: ${esc(list(e.equipment))}</div><button class="tech" type="button">VER TÉCNICA</button></div></article>`}
function render(){let q=norm($('buscador').value),eq=$('equipo').value,f=all.filter(e=>(!q||allText(e).includes(q))&&muscle(e)&&equip(e,eq)),v=f.slice(0,shown);$('resultados').innerHTML=v.map(card).join('');$('estado').style.display=v.length?'none':'block';$('contador').textContent=f.length?`Mostrando ${v.length} de ${f.length} ejercicios`:'0 ejercicios encontrados';$('cargarMas').style.display=v.length<f.length?'inline-block':'none'}
function openModal(id){let e=all.find(x=>x.id===id);if(!e)return;let g=guide(e),ins=a(e.instructions).filter(Boolean).join(' ')||g.move;$('modalContenido').innerHTML=`<img src="${GIF_URL+encodeURIComponent(e.gif)}" alt="${esc(e.name)}"><h2>${esc(e.name)}</h2><div class="facts"><div class="fact"><b>MÚSCULO PRINCIPAL</b>${esc(list(e.targetMuscles))}</div><div class="fact"><b>MÚSCULOS SECUNDARIOS</b>${esc(list(e.secondaryMuscles))}</div><div class="fact"><b>EQUIPO</b>${esc(list(e.equipment))}</div><div class="fact"><b>¿PARA QUÉ SIRVE?</b>${esc(purpose(e))}</div></div><h3>Cómo realizarlo</h3><p>${esc(ins)}</p><h3>Posición inicial</h3><p>${esc(g.start)}</p><h3>Movimiento</h3><p>${esc(g.move)}</p><h3>Respiración</h3><p>${esc(g.breath)}</p><h3>Errores comunes</h3><p>${esc(g.errors)}</p><h3>Consejos del coach</h3><p>${esc(g.coach)}</p>`;$('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
$('musculos').innerHTML=groups.map(([v,n])=>`<button class="${v?'':'active'}" data-group="${v}">${n}</button>`).join('');$('buscador').addEventListener('input',()=>{shown=PAGE;render()});$('equipo').addEventListener('change',()=>{shown=PAGE;render()});$('musculos').addEventListener('click',e=>{if(e.target.dataset.group===undefined)return;active=e.target.dataset.group;document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b===e.target));shown=PAGE;render()});$('cargarMas').addEventListener('click',()=>{shown+=PAGE;render()});$('resultados').addEventListener('click',e=>{let c=e.target.closest('[data-open]');if(c)openModal(c.dataset.open)});$('cerrar').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});addEventListener('scroll',()=>$('arriba').classList.toggle('show',scrollY>500));$('arriba').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
(async()=>{try{let r=await Promise.all([fetch('./ejercicios.json'),fetch('./ejercicios-nuevos.json')]);if(r.some(x=>!x.ok))throw Error('HTTP');let d=await Promise.all(r.map(x=>x.json())),m=new Map();d.flat().forEach(e=>{if(e&&e.id){if(e.id==='MCUh f1F')e.id='MCUhf1F';m.set(e.id,e)}});all=[...m.values()];render()}catch(e){$('estado').textContent='No se pudo cargar la biblioteca.';$('cargarMas').style.display='none';console.error(e)}})();
</script>
</body>
</html>

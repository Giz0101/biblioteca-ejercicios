<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LEGENDS GYM | Biblioteca de ejercicios</title>
<style>
:root{--black:#0d0d0d;--card:#202020;--yellow:#f5c400;--white:#f8f8f8;--muted:#b9b9b9;--line:#383838}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#090909,#1b1b1b);border-bottom:4px solid var(--yellow);padding:30px 16px 25px;text-align:center}.logo-space{height:36px;width:150px;margin:0 auto 8px;border:1px dashed #555;border-radius:7px;color:#777;font-size:11px;display:flex;align-items:center;justify-content:center}.eyebrow{margin:0;color:var(--yellow);font-weight:800;letter-spacing:2px;font-size:15px}.brand{margin:4px 0;color:var(--yellow);font-size:clamp(2rem,6vw,3.5rem);letter-spacing:1px}.subtitle{margin:0;color:#fff;font-weight:700;letter-spacing:1px}.description{margin:9px 0 0;color:var(--muted)}.official{margin:8px 0 0;color:var(--yellow);font-size:13px;font-weight:700}.tools{width:min(1180px,94%);margin:22px auto 10px}.search{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#171717;font-size:16px}.quick{display:flex;gap:8px;overflow-x:auto;padding:13px 0 7px;scrollbar-width:thin}.quick button{white-space:nowrap;border:1px solid #555;border-radius:999px;padding:9px 14px;background:#242424;color:#fff;cursor:pointer;font-weight:700}.quick button.active{background:var(--yellow);border-color:var(--yellow);color:#111}.advanced{display:flex;gap:10px;flex-wrap:wrap}.advanced select{flex:1;min-width:180px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#222;color:#fff;font-size:15px}.summary{width:min(1180px,94%);margin:12px auto;color:var(--muted);font-weight:700}.grid{width:min(1180px,94%);margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:var(--yellow)}.card img{width:100%;height:175px;object-fit:contain;background:#111;display:block}.card-body{padding:13px}.card h2{font-size:17px;margin:6px 0 10px}.primary{color:var(--yellow);font-size:13px;font-weight:700}.equipment{font-size:13px;color:#ddd;margin-top:6px}.tech{width:100%;margin-top:12px;border:0;border-radius:7px;padding:10px;background:var(--yellow);color:#111;font-weight:800;cursor:pointer}.more-wrap{text-align:center;padding:8px 0 42px}.more{border:1px solid var(--yellow);background:var(--yellow);color:#111;padding:13px 24px;border-radius:8px;font-weight:800;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px}.top{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border:0;border-radius:50%;background:var(--yellow);color:#111;font-size:22px;font-weight:bold;cursor:pointer;display:none;z-index:5}.top.show{display:block}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modal-box{width:min(920px,100%);max-height:94vh;overflow:auto;background:#191919;border:1px solid #555;border-top:5px solid var(--yellow);border-radius:12px;position:relative}.close{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:var(--yellow);color:#111;font-size:24px;font-weight:bold;cursor:pointer}.modal-content{padding:24px}.modal-content img{display:block;width:100%;max-height:390px;object-fit:contain;background:#0b0b0b;border-radius:8px}.modal h2{font-size:clamp(1.4rem,4vw,2.1rem);margin:18px 0 8px}.modal h3{color:var(--yellow);font-size:16px;margin:18px 0 5px}.modal p{color:#eee;line-height:1.55;margin:5px 0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:#242424;border-radius:7px;padding:10px}.fact b{display:block;color:var(--yellow);font-size:12px;margin-bottom:4px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:135px}.card-body{padding:10px}.card h2{font-size:14px}.tech{font-size:12px;padding:9px}.modal{padding:0}.modal-box{height:100%;max-height:100%;border-radius:0}.modal-content{padding:18px 14px 30px}.modal-content img{max-height:300px}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="inicio"><div class="logo-space">ESPACIO PARA LOGOTIPO</div><p class="eyebrow">BIBLIOTECA DE EJERCICIOS</p><h1 class="brand">LEGENDS GYM</h1><p class="subtitle">BIBLIOTECA DE EJERCICIOS</p><p class="description">Biblioteca de consulta y capacitación de Legends Gym</p><p class="official">Ejercicios seleccionados y revisados por Legends Gym</p></header>
<section class="tools"><input id="buscador" class="search" type="search" placeholder="Buscar ejercicio, músculo o equipo..." autocomplete="off"><div id="musculos" class="quick"></div><div class="advanced"><select id="equipo"><option value="">Todos los equipos</option><option value="maquina">Máquina</option><option value="polea">Polea</option><option value="mancuernas">Mancuernas</option><option value="barra">Barra</option><option value="smith">Smith</option><option value="banco">Banco</option><option value="peso corporal">Peso corporal</option><option value="bandas">Bandas</option><option value="otros">Otros</option></select></div></section>
<div id="contador" class="summary"></div><main id="resultados" class="grid"></main><div id="estado" class="empty">Cargando ejercicios...</div><div class="more-wrap"><button id="cargarMas" class="more">CARGAR MÁS EJERCICIOS</button></div><button id="arriba" class="top" aria-label="Volver arriba">↑</button>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"><div class="modal-box"><button id="cerrar" class="close" aria-label="Cerrar">×</button><div id="modalContenido" class="modal-content"></div></div></div>
<script>
const GIF_URL="https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/",PAGE_SIZE=24,$=id=>document.getElementById(id);let ejercicios=[],filtrados=[],visible=PAGE_SIZE,musculoActivo="";
const muscles=[['','Todos'],['chest','Pecho'],['back','Espalda'],['shoulders','Hombros'],['biceps','Bíceps'],['triceps','Tríceps'],['glutes','Glúteos'],['quads','Cuádriceps'],['hamstrings','Femoral'],['calves','Pantorrilla'],['abs','Abdomen']];
function normalize(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function arr(v){return Array.isArray(v)?v:(v?[v]:[])}function list(v){return arr(v).join(', ')||'No especificado'}function searchText(e){return normalize([e.name,e.originalName,e.category,e.equipment,e.targetMuscles,e.secondaryMuscles].flat().filter(Boolean).join(' '))}function primary(e){return list(e.targetMuscles)}
function equipmentMatch(e,filter){if(!filter)return true;let v=normalize(list(e.equipment));if(filter==='otros')return !['maquina','polea','mancuernas','barra','smith','banco','peso corporal','bandas'].some(x=>v.includes(x));return v.includes(normalize(filter))}
function muscleMatch(e){if(!musculoActivo)return true;let v=normalize([e.category,e.targetMuscles,e.secondaryMuscles].flat().join(' ')),terms={chest:['chest','pecho','pector'],back:['back','espalda','lats','dorsal'],shoulders:['shoulder','hombro','deltoid','trapec'],biceps:['biceps'],triceps:['triceps'],glutes:['glute'],quads:['quad','cuadriceps'],hamstrings:['hamstring','femoral'],calves:['calf','pantorr'],abs:['abs','abdomen','waist','core']};return(terms[musculoActivo]||[normalize(musculoActivo)]).some(x=>v.includes(x))}
function purpose(e){let c=normalize(e.category),map={piernas:'Fortalece las piernas y mejora la fuerza y estabilidad.',abdomen:'Fortalece el abdomen y mejora la estabilidad del torso.',espalda:'Fortalece la espalda y mejora la postura y la fuerza de tracción.',pecho:'Desarrolla el pecho y mejora la fuerza de empuje.',biceps:'Fortalece los bíceps y la flexión del brazo.',triceps:'Fortalece los tríceps y la extensión del brazo.',hombros:'Fortalece los hombros y mejora la estabilidad.',antebrazos:'Fortalece los antebrazos y el agarre.',cardio:'Mejora la resistencia cardiovascular.',estiramientos:'Mejora la flexibilidad y la movilidad.'};return map[c]||`Trabaja principalmente ${primary(e)} y ayuda a mejorar el control y la fuerza.`}
function technical(e){let c=normalize(e.category),eq=normalize(list(e.equipment)),target=primary(e),machine=eq.includes('maquina')?' en la máquina':eq.includes('polea')?' en la polea':eq.includes('mancuerna')?' con mancuernas':eq.includes('barra')?' con barra':eq.includes('smith')?' en Smith':'';let guide={pecho:['Acuéstate o colócate estable, retrae suavemente los hombros y prepara el equipo.','Empuja o junta los brazos de forma controlada y regresa lentamente, sin rebotar.'],espalda:['Mantén el pecho abierto, la espalda neutra y los hombros abajo.','Lleva los codos hacia atrás sin balancear el torso y vuelve lentamente.'],hombros:['Colócate erguido con el abdomen activo y los hombros relajados.','Eleva o presiona con control, sin encoger los hombros ni usar impulso.'],biceps:['Mantén los codos cerca del cuerpo y el torso estable.','Flexiona los codos hasta contraer el bíceps y baja lentamente.'],triceps:['Estabiliza los hombros y mantén los codos apuntando al frente o cerca del cuerpo.','Extiende los codos sin bloquearlos bruscamente y regresa con control.'],cuadriceps:['Apoya bien los pies, activa el abdomen y mantén las rodillas alineadas.','Flexiona las piernas y vuelve empujando el suelo, manteniendo el control.'],femoral:['Coloca la cadera estable y mantén la espalda neutra.','Flexiona la rodilla o lleva la cadera atrás sintiendo el trabajo posterior.'],gluteos:['Apoya los pies firmemente y mantén la pelvis estable.','Extiende la cadera apretando los glúteos sin arquear exageradamente la espalda.'],pantorrilla:['Colócate estable con el peso repartido en la parte delantera del pie.','Eleva los talones lentamente, pausa arriba y desciende por completo.'],abdomen:['Coloca la espalda y la pelvis en una posición estable, activando el abdomen.','Acerca el torso o las piernas con control sin tirar del cuello.'],cardio:['Adopta una postura atlética y prepara el cuerpo para moverte con seguridad.','Realiza el movimiento a un ritmo constante y ajusta la intensidad a tu nivel.'],estiramientos:['Adopta una postura cómoda y alineada, sin forzar la articulación.','Avanza suavemente hasta sentir tensión ligera y mantén sin rebotes.']};let g=guide[c]||[`Colócate correctamente${machine} y activa ${target}.`,`Realiza el movimiento de forma controlada${machine} y vuelve lentamente a la posición inicial.`];return {start:g[0],move:g[1],breath:'Inhala durante la preparación y exhala durante la parte de esfuerzo.',errors:'Evita usar impulso, encorvar la espalda o perder el control del movimiento.',coach:'Prioriza la técnica, usa un rango cómodo y aumenta la carga solo cuando puedas mantener una ejecución limpia.'}}
function card(e){let url=GIF_URL+encodeURIComponent(e.gif);return `<article class="card" data-open="${esc(e.id)}"><img src="${url}" loading="lazy" alt="${esc(e.name)}"><div class="card-body"><h2>${esc(e.name)}</h2><div class="primary">Músculo principal: ${esc(primary(e))}</div><div class="equipment">Equipo: ${esc(list(e.equipment))}</div><button class="tech" type="button" data-open="${esc(e.id)}">VER TÉCNICA</button></div></article>`}
function render(){filtrados=ejercicios.filter(e=>{let q=normalize($('buscador').value.trim());return(!q||searchText(e).includes(q))&&muscleMatch(e)&&equipmentMatch(e,$('equipo').value)});let shown=filtrados.slice(0,visible);$('resultados').innerHTML=shown.map(card).join('');$('estado').style.display=shown.length?'none':'block';$('contador').textContent=filtrados.length?`Mostrando ${shown.length} de ${filtrados.length} ejercicios`:'0 ejercicios encontrados';$('cargarMas').style.display=shown.length<filtrados.length?'inline-block':'none'}
function openModal(id){let e=ejercicios.find(x=>x.id===id);if(!e)return;let g=technical(e),url=GIF_URL+encodeURIComponent(e.gif),instructions=arr(e.instructions).filter(Boolean).join(' ')||g.move;$('modalContenido').innerHTML=`<img src="${url}" alt="${esc(e.name)}"><h2 id="modalTitulo">${esc(e.name)}</h2><div class="facts"><div class="fact"><b>MÚSCULO PRINCIPAL</b>${esc(primary(e))}</div><div class="fact"><b>MÚSCULOS SECUNDARIOS</b>${esc(list(e.secondaryMuscles))}</div><div class="fact"><b>EQUIPO</b>${esc(list(e.equipment))}</div><div class="fact"><b>¿PARA QUÉ SIRVE?</b>${esc(purpose(e))}</div></div><h3>Cómo realizar el ejercicio</h3><p>${esc(instructions)}</p><h3>Posición inicial</h3><p>${esc(g.start)}</p><h3>Movimiento</h3><p>${esc(g.move)}</p><h3>Respiración</h3><p>${esc(g.breath)}</p><h3>Errores comunes</h3><p>${esc(g.errors)}</p><h3>Consejos del coach</h3><p>${esc(g.coach)}</p>`;$('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
function setupMuscles(){$('musculos').innerHTML=muscles.map(([v,n])=>`<button class="${v===''?'active':''}" data-muscle="${v}">${n}</button>`).join('')}
async function load(){try{let rs=await Promise.all([fetch('./ejercicios.json'),fetch('./ejercicios-nuevos.json')]);let data=await Promise.all(rs.map(r=>r.json()));let map=new Map();data.flat().forEach(e=>{if(e?.id)map.set(e.id,e)});ejercicios=[...map.values()];render()}catch(e){$('estado').textContent='No se pudo cargar la biblioteca.';$('cargarMas').style.display='none'}}
setupMuscles();$('buscador').addEventListener('input',()=>{visible=PAGE_SIZE;render()});$('equipo').addEventListener('change',()=>{visible=PAGE_SIZE;render()});$('musculos').addEventListener('click',e=>{if(e.target.dataset.muscle===undefined)return;musculoActivo=e.target.dataset.muscle;document.querySelectorAll('[data-muscle]').forEach(b=>b.classList.toggle('active',b===e.target));visible=PAGE_SIZE;render()});$('cargarMas').addEventListener('click',()=>{visible+=PAGE_SIZE;render()});$('resultados').addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openModal(b.dataset.open)});$('cerrar').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('scroll',()=>$('arriba').classList.toggle('show',scrollY>500));$('arriba').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));load();
</script>
</body>
</html>
